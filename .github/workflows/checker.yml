name: Checker Config

on:
  pull_request:
    branches:
      - main

jobs:
  check_file:
    runs-on: ubuntu-latest
    name: check file
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        if: always()

      - name: Show added files
        if: always()
        run: |
          nb_found=0
          for file in ${{ steps.changed-files.outputs.added_files }}; do
            echo "Fichier ajouté : $file"
            if [[ "$file" == *"preview.png" ]]; then
              echo "Trouvé"
              nb_found=$((nb_found + 1))
            fi
            if [[ "$file" == *"info.png" ]]; then
              echo "Trouvé"
              nb_found=$((nb_found + 1))
            fi
            if [[ "$file" == *"settings.toml" ]]; then
              echo "Trouvé"
              nb_found=$((nb_found + 1))
            fi
          done
          if $((nb_found)) >= 3; do
            return 0
          fi
          if $((nb_found)) < 3; do
            return 84
          fi
  check_info_json:
    runs-on: ubuntu-latest
    name: runs_tests
    needs: [check_file]
    if: needs.check_file.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0