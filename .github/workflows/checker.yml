name: Checker Config

on:
  pull_request:
    branches:
      - main

jobs:
  check_file:
    runs-on: ubuntu-latest
    name: check file
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate info.json files
        run: |
          output=$(python3 .github/workflows/checker_scipt.py 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "JSON validation failed"
            exit $status
          fi